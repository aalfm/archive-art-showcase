<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ARCHIVE — Where Architecture Meets Digital Expression.">
  <defs>
    <!-- Deep Navy Architectural Background -->
    <linearGradient id="bgNavy" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081022" />
      <stop offset="50%" stop-color="#0D1730" />
      <stop offset="100%" stop-color="#0A1328" />
    </linearGradient>

    <!-- Soft Ambient Glows -->
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(230 90) rotate(25) scale(360 210)">
      <stop offset="0%" stop-color="#4A6FA5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4A6FA5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(970 250) rotate(-18) scale(380 220)">
      <stop offset="0%" stop-color="#B5A284" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#B5A284" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Rule Gradient -->
    <linearGradient id="accentRule" x1="480" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A6FA5" stop-opacity="0" />
      <stop offset="30%" stop-color="#5C7FA8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#B5A284" stop-opacity="1" />
      <stop offset="70%" stop-color="#5C7FA8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4A6FA5" stop-opacity="0" />
    </linearGradient>

    <!-- Architectural Drafting Grid Pattern -->
    <pattern id="draftGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#6B8BB8" stroke-opacity="0.075" stroke-width="1" />
    </pattern>

    <!-- Rounded Banner Clip -->
    <clipPath id="bannerClip">
      <rect width="1200" height="340" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Base Layers -->
    <rect width="1200" height="340" fill="url(#bgNavy)" />
    <rect width="1200" height="340" fill="url(#draftGrid)" />
    <rect width="1200" height="340" fill="url(#glowLeft)" />
    <rect width="1200" height="340" fill="url(#glowRight)" />

    <!-- Outer Hairline Architectural Frame -->
    <rect x="16" y="16" width="1168" height="308" rx="12" stroke="#B5A284" stroke-opacity="0.22" stroke-width="1" />
    <rect x="22" y="22" width="1156" height="296" rx="9" stroke="#5C7FA8" stroke-opacity="0.14" stroke-width="1" />

    <!-- Left Geometric Architectural Wireframe -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M 48 292 L 156 124 L 284 218 L 368 88" stroke="#5C7FA8" stroke-opacity="0.28" stroke-width="1.2" fill="none" />
      <path d="M 48 210 L 156 124 L 222 292" stroke="#B5A284" stroke-opacity="0.22" stroke-width="1" fill="none" />
      <path d="M 96 64 L 156 124 L 310 112 L 284 218" stroke="#5C7FA8" stroke-opacity="0.18" stroke-width="1" fill="none" />
      <line x1="156" y1="22" x2="156" y2="318" stroke="#5C7FA8" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3 5" />
      <line x1="22" y1="218" x2="340" y2="218" stroke="#B5A284" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3 5" />
      <circle cx="156" cy="124" r="3.5" fill="#B5A284" fill-opacity="0.7" />
      <circle cx="284" cy="218" r="3" fill="#5C7FA8" fill-opacity="0.75" />
      <circle cx="368" cy="88" r="2.5" fill="#EAE7E0" fill-opacity="0.5" />
      <circle cx="96" cy="64" r="2.5" fill="#5C7FA8" fill-opacity="0.6" />
      <circle cx="222" cy="292" r="2.5" fill="#B5A284" fill-opacity="0.55" />
    </g>

    <!-- Right Geometric Architectural Wireframe -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M 832 252 L 916 122 L 1044 216 L 1152 48" stroke="#5C7FA8" stroke-opacity="0.28" stroke-width="1.2" fill="none" />
      <path d="M 978 48 L 1044 216 L 1152 130" stroke="#B5A284" stroke-opacity="0.22" stroke-width="1" fill="none" />
      <path d="M 890 228 L 916 122 L 1104 276 L 1044 216" stroke="#5C7FA8" stroke-opacity="0.18" stroke-width="1" fill="none" />
      <line x1="1044" y1="22" x2="1044" y2="318" stroke="#5C7FA8" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3 5" />
      <line x1="860" y1="122" x2="1178" y2="122" stroke="#B5A284" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3 5" />
      <circle cx="1044" cy="216" r="3.5" fill="#B5A284" fill-opacity="0.7" />
      <circle cx="916" cy="122" r="3" fill="#5C7FA8" fill-opacity="0.75" />
      <circle cx="832" cy="252" r="2.5" fill="#EAE7E0" fill-opacity="0.5" />
      <circle cx="1104" cy="276" r="2.5" fill="#5C7FA8" fill-opacity="0.6" />
      <circle cx="978" cy="48" r="2.5" fill="#B5A284" fill-opacity="0.55" />
    </g>

    <!-- Subtle Center Radial Perspective Rings -->
    <circle cx="600" cy="170" r="142" stroke="#5C7FA8" stroke-opacity="0.12" stroke-width="1" />
    <circle cx="600" cy="170" r="196" stroke="#B5A284" stroke-opacity="0.09" stroke-width="1" stroke-dasharray="4 6" />

    <!-- Corner Architectural Annotations -->
    <text x="42" y="46" fill="#7D98BE" fill-opacity="0.8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.4">DIGITAL ARCHITECTURE SHOWCASE</text>
    <text x="1158" y="46" text-anchor="end" fill="#B5A284" fill-opacity="0.8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2.4">EXHIBITION PLATFORM</text>
    <text x="42" y="302" fill="#7D98BE" fill-opacity="0.65" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="2">CURATED CHALLENGES · VISUAL PORTFOLIOS</text>
    <text x="1158" y="302" text-anchor="end" fill="#7D98BE" fill-opacity="0.65" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="2">NEXT.JS · POSTGRESQL</text>

    <!-- Center Architectural Crest (Inspired by Official ARCHIVE Arch & Star Mark) -->
    <g transform="translate(574, 62) scale(1.15)">
      <path d="M2.17836 28.5H11.5L24.1155 11.6794C24.5395 11.114 25.4002 11.1549 25.7687 11.7579L35.7076 28.0215C35.8892 28.3187 36.2125 28.5 36.5608 28.5H43L27.4074 4.47897C25.9544 2.24058 22.7587 2.02564 21.019 4.04931L1.42004 26.8481C0.862659 27.4965 1.32333 28.5 2.17836 28.5Z" fill="#EAE7E0" />
      <path d="M24.5 18C24.5 18 25.1904 20.357 26.1667 21.3333C27.143 22.3096 29.5 23 29.5 23C29.5 23 27.143 23.6904 26.1667 24.6667C25.1904 25.643 24.5 28 24.5 28C24.5 28 23.8096 25.643 22.8333 24.6667C21.857 23.6904 19.5 23 19.5 23C19.5 23 21.857 22.3096 22.8333 21.3333C23.8096 20.357 24.5 18 24.5 18Z" fill="#B5A284" />
    </g>

    <!-- Primary Wordmark -->
    <text x="600" y="182" text-anchor="middle" fill="#F7F5F0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="16">ARCHIVE</text>

    <!-- Structural Divider -->
    <rect x="460" y="203" width="280" height="1.5" fill="url(#accentRule)" />

    <!-- Tagline -->
    <text x="600" y="238" text-anchor="middle" fill="#D8CBB8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18.5" font-weight="500" letter-spacing="2.2">Where Architecture Meets Digital Expression.</text>
  </g>
</svg>
